# Static hosting for the built SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chat routes are client-side; unknown paths still boot the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health probe (independent of the backend's health).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Harden the static surface.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
