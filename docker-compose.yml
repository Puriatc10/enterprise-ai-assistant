# Local development stack: API + static frontend.
#
#   docker compose up --build      start both services
#   docker compose config          validate this file only
#
# No database service on purpose: application persistence is Supabase (managed),
# and connector data sources are external. Adding a Postgres container here would
# misrepresent the architecture and make local state authoritative by accident.

name: enterprise-ai-assistant

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: enterprise-ai-assistant-api:dev
    # Optional: the API boots fine without one (health needs no credentials).
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      API_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public value, baked in at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: enterprise-ai-assistant-web:dev
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
