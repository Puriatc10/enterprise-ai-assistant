# Render blueprint — one API container, one static site.
#
# Free plan on purpose: the demonstration does not need more, and paying for idle
# capacity would hide the constraints the project documents (see docs/development/
# DEPLOYMENT.md). Secrets are `sync: false`, so Render prompts for them and they never
# enter this file or the repository.

services:
  - type: web
    name: enterprise-ai-assistant-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # The model is configuration, not architecture (ADR-0003).
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      # Free-tier routes are slow; the adapter owns retries (Phase 1 finding).
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      # Synthetic data only until a Didar24 agreement exists (ADR-0002).
      - key: POLICIES_SOURCE
        value: mock
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Must be the static site's exact origin, e.g. https://enterprise-ai-assistant.onrender.com
      - key: API_CORS_ORIGINS
        sync: false

  - type: web
    name: enterprise-ai-assistant-web
    runtime: static
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Build-time and public by design: Vite inlines every VITE_ variable, and
      # scripts/check_bundle_secrets.py fails the build if a credential shape appears.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Single-page app: the login and chat screens are client-side states.
      - type: rewrite
        source: /*
        destination: /index.html
